
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="260" viewBox="0 0 320 260">
  <defs>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bfc4cc"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5a2b"/>
      <stop offset="100%" stop-color="#3b2114"/>
    </linearGradient>
  </defs>

  <rect width="320" height="260" fill="#202124"/>

  <!-- Steam -->
  <g fill="none" stroke="#e6e6e6" stroke-width="5" stroke-linecap="round">
    <path d="M112 74 C94 58 124 48 109 29"/>
    <path d="M157 70 C139 52 170 42 155 23"/>
    <path d="M201 74 C183 58 213 48 198 29"/>
  </g>

  <!-- Coffee cup -->
  <path d="M77 91 L225 91 L211 177
           Q207 196 187 196 L116 196
           Q96 196 92 177 Z"
        fill="url(#cup)" stroke="#ffffff" stroke-width="4"/>

  <!-- Coffee surface -->
  <ellipse cx="151" cy="94" rx="74" ry="16"
           fill="url(#coffee)" stroke="#ffffff" stroke-width="3"/>

  <!-- Cup handle -->
  <path d="M221 111
           C269 99 274 151 238 162
           L215 166 L219 148
           L235 145
           C252 140 250 120 224 130 Z"
        fill="url(#cup)" stroke="#ffffff" stroke-width="4"/>

  <!-- Coffee swirl -->
  <path d="M118 95
           C130 80 153 82 164 94
           C174 105 153 111 143 101
           C135 94 148 88 157 95"
        fill="none" stroke="#d9b38c" stroke-width="4"
        stroke-linecap="round"/>

  <!-- Cup band -->
  <path d="M88 133 L216 133 L212 151 L91 151 Z"
        fill="#8b5a2b"/>

  <!-- Coffee bean left -->
  <g transform="translate(72 211) rotate(-28)">
    <ellipse cx="0" cy="0" rx="19" ry="12"
             fill="#8b5a2b" stroke="#d9b38c" stroke-width="2"/>
    <path d="M-15 0 Q0 -13 15 0 Q0 13 -15 0"
          fill="none" stroke="#3b2114" stroke-width="3"/>
  </g>

  <!-- Coffee bean right -->
  <g transform="translate(247 211) rotate(24)">
    <ellipse cx="0" cy="0" rx="19" ry="12"
             fill="#8b5a2b" stroke="#d9b38c" stroke-width="2"/>
    <path d="M-15 0 Q0 -13 15 0 Q0 13 -15 0"
          fill="none" stroke="#3b2114" stroke-width="3"/>
  </g>

  <!-- Small decorative dots -->
  <g fill="#d9b38c">
    <circle cx="48" cy="103" r="3"/>
    <circle cx="269" cy="82" r="3"/>
    <circle cx="48" cy="165" r="2"/>
    <circle cx="274" cy="177" r="2"/>
  </g>
</svg>
