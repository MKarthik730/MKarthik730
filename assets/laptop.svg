<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="Laptop showing code">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b949e"/>
      <stop offset="1" stop-color="#57606a"/>
    </linearGradient>
  </defs>

  <!-- lid -->
  <rect x="50" y="14" width="220" height="146" rx="10" fill="#30363d"/>
  <rect x="58" y="22" width="204" height="130" rx="4" fill="url(#screen)"/>

  <!-- window dots -->
  <circle cx="70" cy="33" r="3.5" fill="#ff5f56"/>
  <circle cx="82" cy="33" r="3.5" fill="#ffbd2e"/>
  <circle cx="94" cy="33" r="3.5" fill="#27c93f"/>

  <!-- code lines -->
  <g stroke-linecap="round" stroke-width="5">
    <line x1="70"  y1="55"  x2="110" y2="55"  stroke="#ff7b72"/>
    <line x1="116" y1="55"  x2="170" y2="55"  stroke="#79c0ff"/>
    <line x1="82"  y1="70"  x2="120" y2="70"  stroke="#d2a8ff"/>
    <line x1="126" y1="70"  x2="196" y2="70"  stroke="#8b949e"/>
    <line x1="82"  y1="85"  x2="150" y2="85"  stroke="#7ee787"/>
    <line x1="156" y1="85"  x2="186" y2="85"  stroke="#ffa657"/>
    <line x1="94"  y1="100" x2="132" y2="100" stroke="#79c0ff"/>
    <line x1="138" y1="100" x2="214" y2="100" stroke="#8b949e"/>
    <line x1="82"  y1="115" x2="106" y2="115" stroke="#ff7b72"/>
    <line x1="112" y1="115" x2="176" y2="115" stroke="#d2a8ff"/>
    <line x1="70"  y1="130" x2="98"  y2="130" stroke="#ffa657"/>
  </g>

  <!-- blinking cursor -->
  <rect x="104" y="124" width="6" height="12" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- base -->
  <path d="M30 164 H290 L300 176 Q300 186 288 186 H32 Q20 186 20 176 Z" fill="url(#base)"/>
  <rect x="132" y="164" width="56" height="6" rx="3" fill="#30363d"/>

  <!-- floating chips -->
  <g font-family="monospace" font-size="11" font-weight="bold">
    <rect x="6" y="40" width="44" height="22" rx="6" fill="#3776AB"/>
    <text x="14" y="55" fill="#fff">py</text>
    <rect x="270" y="64" width="44" height="22" rx="6" fill="#20232A" stroke="#61DAFB"/>
    <text x="278" y="79" fill="#61DAFB">tsx</text>
    <rect x="262" y="118" width="52" height="22" rx="6" fill="#009688"/>
    <text x="270" y="133" fill="#fff">API</text>
  </g>
</svg>
