<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270" role="img" aria-label="Terminal card: whoami, focus, building, status">
  <rect width="800" height="270" rx="16" fill="#0d1117"/>
  <rect width="800" height="38" rx="16" fill="#161b22"/>
  <rect y="22" width="800" height="16" fill="#161b22"/>
  <circle cx="26" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="19" r="6" fill="#27c93f"/>
  <text x="400" y="24" font-family="Consolas, Menlo, monospace" font-size="13" text-anchor="middle" fill="#8b949e">karthik@github: ~</text>

  <g font-family="Consolas, Menlo, monospace" font-size="17">
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="0.3s" dur="0.2s" fill="freeze"/>
      <text x="28" y="80" fill="#7ee787">$ <tspan fill="#e6edf3">whoami</tspan></text>
      <text x="48" y="104" fill="#79c0ff">karthik — CS student @ ANITS, Visakhapatnam</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="1.3s" dur="0.2s" fill="freeze"/>
      <text x="28" y="140" fill="#7ee787">$ <tspan fill="#e6edf3">cat focus.txt</tspan></text>
      <text x="48" y="164" fill="#d2a8ff">agentic AI · machine learning · full-stack</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="2.3s" dur="0.2s" fill="freeze"/>
      <text x="28" y="200" fill="#7ee787">$ <tspan fill="#e6edf3">ls ~/building</tspan></text>
      <text x="48" y="224" fill="#ffa657">cognitus/   void/   memoir/</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="3.3s" dur="0.2s" fill="freeze"/>
      <text x="28" y="256" fill="#7ee787">$ <tspan fill="#e6edf3">git status</tspan> <tspan fill="#58a6ff">→ open to internships ✔</tspan></text>
      <rect x="352" y="242" width="9" height="18" fill="#58a6ff">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
